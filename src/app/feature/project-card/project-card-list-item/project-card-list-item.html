

    <div class="project-card">
      <h3 class="item">{{project().name}}</h3>
      @if(isFirst()){
        <span class="badge"> First Project</span>
      }
      @else if(isFirst()){
        <p>Last project</p>
      }

      <p>{{project().description}}</p>

      <a [routerLink]="['/project/edit', project().id]">Edit</a>

<!--      <app-project-detail [projectId]="project().id"></app-project-detail>-->
      @switch (project().status){

        @case ("in-progress"){<span id="statusIP">{{project().status}}</span>}
        @default {<span id="statusCP">{{project().status}}</span>}
      }

      <button (click)="toggle()">remove</button>
      <a [routerLink]="['/project', project().id]">View More</a>


    </div>
